generators:
  train:
    _target_: tetnp.data.gp.FiniteMixtureGPGeneratorUniformInput
    _convert_: al
    dim: ${params.dim_x}
    kernels: ${gibbs_kernels}
    noise_std: 0.1
    min_nc: 1
    max_nc: 64
    min_nt: 128
    max_nt: 128
    context_range: ${params.context_range}
    target_range: ${params.target_range}
    samples_per_epoch: 16_000
    batch_size: 16
  val:
    _target_: tetnp.data.gp.FiniteMixtureGPGeneratorUniformInput
    dim: ${params.dim_x}
    kernels: ${product:tnp.networks.kernels.GibbsKernel,${gibbs_kernel_params}}
    noise_std: 0.1
    min_nc: 1
    max_nc: 64
    min_nt: 128
    max_nt: 128
    context_range: ${params.context_range}
    target_range: ${params.target_range}
    samples_per_epoch: 4096
    batch_size: 16
    deterministic: True
  test:
    _target_: tetnp.data.gp.FiniteMixtureGPGeneratorUniformInput
    dim: ${params.dim_x}
    kernels: ${product:tnp.networks.kernels.GibbsKernel,${gibbs_kernel_params}}
    noise_std: 0.1
    min_nc: 1
    max_nc: 64
    min_nt: 128
    max_nt: 128
    context_range: ${params.context_range}
    target_range: ${params.target_range}
    samples_per_epoch: 4096
    batch_size: 16
    deterministic: True

gibbs_kernels: ${product:tnp.networks.kernels.GibbsKernel,${gibbs_kernel_params}}

gibbs_kernel_params:
  ard_num_dims: ${params.dim_x}
  lengthscale_fn: ${product:tnp.networks.kernels.gibbs_switching_lengthscale_fn,${lengthscale_fn_params}}

lengthscale_fn_params:
  _partial_: True
  changepoint: ${params.changepoints}
  direction: ${params.directions}

params:
  dim_x: 1
  dim_y: 1
  context_range: [[-2.0, 2.0]]
  target_range: [[-4.0, 4.0]]
  changepoints: [-1.0, 0.0, 1.0]
  directions: [True, False]


misc:
  project: gibbs-1d-regression
  eval_name: test
  seed: 1
  only_plots: False
  num_plots: 10
  subplots: False
  savefig: False
  logging: False
  plot_interval: 10
  check_val_every_n_epoch: 10
  num_workers: 0
  num_val_workers: 0
