model:
  _target_: tnp.models.convcnp.ConvCNP
  encoder: ${convcnp_encoder}
  decoder: ${tnp_decoder}
  likelihood: ${likelihood}

convcnp_encoder:
  _target_: tetnp.models.ateconvcnp.RelaxedConvCNPEncoder
  conv_net: ${cnn}
  grid_encoder: ${grid_encoder}
  grid_decoder: ${grid_decoder}
  z_encoder: ${z_encoder}
  p_basis_dropout: ${params.p_basis_dropout}

cnn:
  _target_: tetnp.networks.atecnn.RelaxedCNN
  dim: ${params.dim_x}
  num_channels: ${params.num_channels}
  num_blocks: ${params.num_blocks}
  kernel_size: ${params.kernel_size}
  basis_fn: ${basis_fn}
  num_basis: ${params.num_basis}

basis_fn:
  _target_: tetnp.networks.modules.ModuleOnPreSpecifiedDomain
  module: ${basis_fn_net}
  x_range: ${params.basis_fn_range}
  default_val: 0.0

basis_fn_net:
  _target_: tnp.networks.mlp.MLP
  in_dim: ${params.dim_x}
  out_dim: ${params.num_basis}
  num_layers: 2
  width: ${params.num_channels}

grid_encoder:
  _target_: tnp.networks.setconv.SetConvGridEncoder
  dims: ${params.dim_x}
  grid_range: ${params.grid_range}
  grid_shape: ${params.grid_shape}
  init_lengthscale: ${params.init_lengthscale}

grid_decoder:
  _target_: tnp.networks.setconv.SetConvGridDecoder
  dims: ${params.dim_x}

z_encoder:
  _target_: tnp.networks.mlp.MLP
  in_dim: ${eval:'${params.dim_y} + 1'}
  out_dim: ${params.num_channels}
  num_layers: 2
  width: ${params.num_channels}

tnp_decoder:
  _target_: tnp.models.tnp.TNPDecoder
  z_decoder: ${z_decoder}

z_decoder:
  _target_: tnp.networks.mlp.MLP
  in_dim: ${params.num_channels}
  out_dim: ${eval:'2 * ${params.dim_y}'}
  num_layers: 2
  width: ${params.num_channels}

likelihood:
  _target_: tnp.likelihoods.gaussian.HeteroscedasticNormalLikelihood

optimiser:
  _target_: torch.optim.AdamW
  _partial_: True
  lr: 5.0e-4

params:
  epochs: 500
  num_channels: 32
  num_blocks: 5
  kernel_size: 9
  num_decoder_kernels: 5
  grid_range: ${params.target_range}
  grid_shape: [128,]
  init_lengthscale: 0.1
  basis_fn_range: ${params.context_range}
  num_basis: 3
  p_basis_dropout: 0.5

misc:
  name: RelaxedConvCNP-L${params.num_blocks}-C${params.num_channels}-K${params.kernel_size}-GS${params.grid_shape}
  resume_from_checkpoint: null
  gradient_clip_val: 0.5
  plot_interval: 10
