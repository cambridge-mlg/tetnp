model:
  _target_: tetnp.models.tetnp.TETNP
  encoder: ${atetnp_encoder}
  decoder: ${tnp_decoder}
  likelihood: ${likelihood}

atetnp_encoder:
  _target_: tetnp.models.tetnp.TETNPEncoder
  transformer_encoder: ${ateist_encoder}
  y_encoder: ${y_encoder}

ateist_encoder:
  _target_: tetnp.networks.atetransformer.ATEISTEncoder
  dim: ${params.dim_x}
  num_latents: ${params.num_latents}
  mhca_ctoq_layer: ${mhca_ctoq_layer}
  mhca_qtoc_layer: ${mhca_qtoc_layer}
  mhca_qtot_layer: ${mhca_qtot_layer}
  num_layers: ${params.num_layers}
  basis_fn: ${basis_fn}
  p_basis_dropout: ${params.p_basis_dropout}

mhca_ctoq_layer:
  _target_: tetnp.networks.teattention_layers.MultiHeadCrossTEAttentionLayer
  embed_dim: ${params.embed_dim}
  num_heads: ${params.num_heads}
  head_dim: ${params.head_dim}
  kernel: ${mhca_ctoq_kernel}
  feedforward_dim: ${params.embed_dim}
  norm_first: ${params.norm_first}

mhca_ctoq_kernel:
  _target_: tnp.networks.mlp.MLP
  in_dim: ${eval:'${params.num_heads} + ${params.dim_x}'}
  out_dim: ${params.num_heads}
  num_layers: 2
  width: ${params.embed_dim}

mhca_qtoc_layer:
  _target_: tetnp.networks.teattention_layers.MultiHeadCrossTEAttentionLayer
  embed_dim: ${params.embed_dim}
  num_heads: ${params.num_heads}
  head_dim: ${params.head_dim}
  kernel: ${mhca_ctoq_kernel}
  feedforward_dim: ${params.embed_dim}
  norm_first: ${params.norm_first}

mhca_qtoc_kernel:
  _target_: tnp.networks.mlp.MLP
  in_dim: ${eval:'${params.num_heads} + ${params.dim_x}'}
  out_dim: ${params.num_heads}
  num_layers: 2
  width: ${params.embed_dim}

mhca_qtot_layer:
  _target_: tetnp.networks.teattention_layers.MultiHeadCrossTEAttentionLayer
  embed_dim: ${params.embed_dim}
  num_heads: ${params.num_heads}
  head_dim: ${params.head_dim}
  kernel: ${mhca_qtot_kernel}
  feedforward_dim: ${params.embed_dim}
  norm_first: ${params.norm_first}

mhca_qtot_kernel:
  _target_: tnp.networks.mlp.MLP
  in_dim: ${eval:'${params.num_heads} + ${params.dim_x}'}
  out_dim: ${params.num_heads}
  num_layers: 2
  width: ${params.embed_dim}

basis_fn:
  _target_: tetnp.networks.modules.ModuleOnPreSpecifiedDomain
  module: ${basis_fn_base}
  x_range: ${params.basis_fn_range}
  default_val: 0.0

basis_fn_base:
  _target_: tnp.networks.mlp.MLP
  in_dim: ${params.dim_x}
  out_dim: ${params.embed_dim}
  num_layers: 2
  width: ${params.embed_dim}

y_encoder:
  _target_: tnp.networks.mlp.MLP
  in_dim: ${eval:'1 + ${params.dim_y}'}
  out_dim: ${params.embed_dim}
  num_layers: 2
  width: ${params.embed_dim}

tnp_decoder:
  _target_: tnp.models.tnp.TNPDecoder
  z_decoder: ${z_decoder}

z_decoder:
  _target_: tnp.networks.mlp.MLP
  in_dim: ${params.embed_dim}
  out_dim: ${eval:'2 * ${params.dim_y}'}
  num_layers: 2
  width: ${params.embed_dim}

likelihood:
  _target_: tnp.likelihoods.gaussian.HeteroscedasticNormalLikelihood

optimiser:
  _target_: torch.optim.AdamW
  _partial_: True
  lr: 5.0e-4

params:
  epochs: 500
  embed_dim: 128
  num_heads: 8
  head_dim: 16
  num_latents: 32
  num_layers: 5
  norm_first: True
  basis_fn_range: ${params.context_range}
  p_basis_dropout: 0.5

misc:
  name: ATEIST-L${params.num_layers}-H${params.num_heads}-D${params.embed_dim}-M${params.num_latents}
  resume_from_checkpoint: null
  plot_interval: 10
  gradient_clip_val: 0.5
